<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Core Case Admin - Usuarios</title>
    <link rel="stylesheet" href="/style.css?v=corecase-20260807b">
    <link rel="stylesheet" href="/admin-style.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-card">
            <h2>Contas de usuarios</h2>
            <p class="muted">Consulte os dados cadastrados e promova contas para administrador quando necessario.</p>
            <input type="text" id="buscaUsuario" placeholder="Buscar por nome, CPF, telefone ou e-mail..." oninput="carregarUsuarios()">
        </div>

        <div id="listaUsuarios"></div>
    </div>

    <script src="/admin.js"></script>
    <script>
        montarNavAdmin('usuarios');
        let usuariosCache = [];

        async function buscarUsuarios() {
            const res = await adminFetch('/api/usuarios');
            usuariosCache = await res.json();
            carregarUsuarios();
        }

        function carregarUsuarios() {
            const termo = (document.getElementById('buscaUsuario').value || '').toLowerCase();
            const container = document.getElementById('listaUsuarios');
            const usuarios = usuariosCache.filter(usuario => {
                const texto = `${usuario.nome || ''} ${usuario.cpf || ''} ${usuario.telefone || ''} ${usuario.email || ''}`.toLowerCase();
                return texto.includes(termo);
            });

            if (!usuarios.length) {
                container.innerHTML = '<div class="admin-card"><p class="muted">Nenhum usuario encontrado.</p></div>';
                return;
            }

            container.innerHTML = usuarios.map(usuario => {
                const admin = Number(usuario.is_admin) === 1;
                return `
                    <div class="admin-card">
                        <div style="display:flex; justify-content:space-between; gap:16px; flex-wrap:wrap;">
                            <div>
                                <h3 style="margin-top:0;">${usuario.nome || 'Sem nome'}</h3>
                                <span class="status-pill ${admin ? 'finalizado' : ''}">${admin ? 'Administrador' : 'Cliente'}</span>
                            </div>
                            <button class="${admin ? 'btn-neutro' : 'btn-sucesso'} btn-pequeno" onclick="alternarAdmin(${usuario.id}, ${admin ? 0 : 1})">
                                ${admin ? 'Remover admin' : 'Promover a admin'}
                            </button>
                        </div>

                        <p><strong>ID:</strong> ${usuario.id}</p>
                        <p><strong>E-mail:</strong> ${usuario.email || '-'}</p>
                        <p><strong>CPF:</strong> ${usuario.cpf || '-'}</p>
                        <p><strong>Telefone:</strong> ${usuario.telefone || '-'}</p>
                        <p><strong>Endereco:</strong> ${usuario.endereco || '-'}</p>
                        <p><strong>CEP:</strong> ${usuario.cep || '-'}</p>
                    </div>
                `;
            }).join('');
        }

        async function alternarAdmin(id, isAdmin) {
            await adminFetch(`/api/usuarios/${id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_admin: isAdmin })
            });
            buscarUsuarios();
        }

        buscarUsuarios();
    </script>
</body>
</html>
