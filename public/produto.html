<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="/analytics.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Case - Detalhes do Produto</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/produto.css">

<body>

    <header class="header-principal">
        <div class="logo">
            <span class="logo-text-header" onclick="window.location.href='/'">CORE CASE</span>
        </div>
        <nav class="nav-principal">
            <a href="/">Home</a>
            <a href="/loja.html" class="ativo">Loja</a>
            <a href="/cart.html">Carrinho</a>
            <div id="menu-usuario" style="display:inline-block; margin-left:25px;"></div>
        </nav>
    </header>

    <main class="main-container">
        <div id="detalhes-container">
            <div class="card-estado">
                <p style="color: #666666; font-size: 15px; margin: 0;">Carregando detalhes do produto...</p>
            </div>
        </div>
    </main>

    <footer class="footer-loja">
        <p>&copy; 2026 <span>Core Case</span>. Todos os direitos reservados. Qualidade e proteção premium para o seu dispositivo.</p>
    </footer>
<script src="/header.js"></script>
<script src="/usuario.js"></script>
<script src="/avaliacoes-ui.js"></script>
    <script>
        function moeda(valor) {
            return Number(valor || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        let produtoAtual = null;
        let quantidadeSelecionada = 1;

        async function carregarProduto() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                window.location.href = '/loja.html';
                return;
            }

            try {
                const res = await fetch(`/api/produtos/${id}`);
                if (!res.ok) throw new Error('Produto não encontrado');
                produtoAtual = await res.json();
                renderizarProduto();
                if (typeof rastrearVisualizacaoProduto === 'function') rastrearVisualizacaoProduto(produtoAtual);
            } catch (erro) {
                document.getElementById('detalhes-container').innerHTML = `
                    <div class="card-estado">
                        <h3>Produto não encontrado ou indisponível.</h3>
                        <p><a href="/loja.html">Voltar para o catálogo da loja</a></p>
                    </div>
                `;
            }
        }

        function lerFotos(produto) {
            try {
                const fotos = JSON.parse(produto.foto || '[]');
                return Array.isArray(fotos) && fotos.length > 0 ? fotos : [produto.foto || 'https://via.placeholder.com/400?text=Core+Case'];
            } catch (e) {
                return produto.foto ? [produto.foto] : ['https://via.placeholder.com/400?text=Core+Case'];
            }
        }

        function renderizarProdutoOriginal() {
            const fotos = lerFotos(produtoAtual);
            const container = document.getElementById('detalhes-container');

            const miniaturasHtml = fotos.map((f, i) => `
                <img src="${f}" class="miniatura ${i === 0 ? 'ativa' : ''}" onclick="trocarFoto('${f}', this)" alt="Miniatura ${i+1}">
            `).join('');

            container.innerHTML = `
                <div class="card-produto">
                    <!-- Coluna da Esquerda: Galeria de Imagens -->
                    <div class="galeria-coluna">
                        <div class="imagem-principal-wrapper">
                            <img id="imagemPrincipal" src="${fotos[0]}" class="imagem-principal" alt="${produtoAtual.nome}">
                        </div>
                        <div class="miniatura-grid">
                            ${miniaturasHtml}
                        </div>
                    </div>

                    <!-- Coluna da Direita: Informações e Ações -->
                    <div class="detalhes-coluna">
                        <h2 class="titulo-produto">${produtoAtual.nome}</h2>
                        
                        <div class="preco-produto">
                            R$ ${moeda(produtoAtual.preco)}
                        </div>

                        <p class="descricao-produto">
                            ${produtoAtual.descricao || 'Sem descrição curta disponível.'}
                        </p>

                        <div class="bloco-info">
                            <h3>Especificações Técnicas</h3>
                            <p>${produtoAtual.sobre || 'Nenhuma especificação informada.'}</p>
                        </div>

                        <div class="bloco-info">
                            <h3>Informações de Envio e Garantia</h3>
                            <p>${produtoAtual.informacoes || 'Consulte as condições de frete e garantia no fechamento do pedido.'}</p>
                        </div>

                        ${(produtoAtual.variantes && produtoAtual.variantes.length > 1) ? `
                        <div class="bloco-info">
                            <h3>Versão / Modelo</h3>
                            <select id="varianteSelecionada" class="select-variante" style="margin-top:8px; width:100%;">
                                ${produtoAtual.variantes.map(v => `<option value="${v}">${v}</option>`).join('')}
                            </select>
                        </div>
                        ` : ''}

                        <div class="acoes-wrapper">
                            <div class="qtd-grupo">
                                <button type="button" onclick="alterarQtd(-1)">-</button>
                                <input type="text" id="quantidade" value="1" readonly>
                                <button type="button" onclick="alterarQtd(1)">+</button>
                            </div>
                            
                            <button class="btn-comprar" onclick="adicionarAoCarrinho()">
                                Adicionar ao Carrinho
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function trocarFoto(url, elemento) {
            document.getElementById('imagemPrincipal').src = url;
            document.querySelectorAll('.miniatura').forEach(img => {
                img.classList.remove('ativa');
            });
            elemento.classList.add('ativa');
        }

        function alterarQtd(delta) {
            quantidadeSelecionada = Math.max(1, quantidadeSelecionada + delta);
            const input = document.getElementById('quantidade');
            if (input) input.value = quantidadeSelecionada;
        }


// Atualize a sua função adicionarAoCarrinho existente para usar a nova lógica:
function adicionarAoCarrinho() {
    if (!produtoAtual) return;

    const seletorVariante = document.getElementById('varianteSelecionada');
    const variante = seletorVariante ? seletorVariante.value : (produtoAtual.variantes && produtoAtual.variantes[0]) || 'Padrão';

    const sucesso = adicionarItemAoCarrinho({
        id: produtoAtual.id,
        nome: produtoAtual.nome,
        preco: (produtoAtual.promocao_ativa && Number(produtoAtual.preco_promocional) > 0) ? produtoAtual.preco_promocional : produtoAtual.preco,
        foto: lerFotos(produtoAtual)[0],
        qtd: quantidadeSelecionada,
        variante: variante
    });

    if (sucesso) window.location.href = '/cart.html';
}

        // Estado da galeria: controla hover livre vs foto travada
        let galeriaFotoTravada = false;
        let galeriaUrlTravada = '';

        function varianteSelecionadaAtual() {
            const seletor = document.getElementById('varianteSelecionada');
            const nome = seletor ? seletor.value : (produtoAtual.variantes && produtoAtual.variantes[0] && produtoAtual.variantes[0].nome);
            return (produtoAtual.variantes || []).find(v => v.nome === nome) || (produtoAtual.variantes || [])[0];
        }

        function estoqueVarianteAtual() {
            const variante = varianteSelecionadaAtual();
            if (variante && variante.estoque !== null && variante.estoque !== undefined) return variante.estoque;
            return produtoAtual.estoque || 0;
        }

        // Ao trocar de versão: se ela tiver uma imagem associada, a galeria muda para essa foto;
        // e o texto de estoque é atualizado para refletir a versão escolhida.
        function trocarVariante(nomeVariante) {
            const variante = (produtoAtual.variantes || []).find(v => v.nome === nomeVariante);
            const textoEstoque = document.getElementById('estoqueTexto');
            if (textoEstoque) {
                textoEstoque.textContent = `${produtoAtual.vendas || 0} vendidos · ${estoqueVarianteAtual()} em estoque`;
            }
            if (variante && variante.imagem) {
                galeriaFotoTravada = true;
                galeriaUrlTravada = variante.imagem;
                const imgPrincipal = document.getElementById('imagemPrincipal');
                if (imgPrincipal) imgPrincipal.src = variante.imagem;
                document.querySelectorAll('.miniatura').forEach(m => {
                    m.classList.toggle('ativa', m.dataset.url === variante.imagem);
                    m.classList.toggle('travada', m.dataset.url === variante.imagem);
                });
            }
        }

        function renderizarProduto() {
            const fotos = lerFotos(produtoAtual);
            const c = document.getElementById('detalhes-container');
            galeriaFotoTravada = false;
            galeriaUrlTravada = fotos[0];
            const tagsProdutoHtml = renderizarTagsProdutoDetalhe(produtoAtual.produto_tags);
            const breadcrumb = produtoAtual.categoria_slug
                ? `<nav class="breadcrumb-produto" aria-label="Caminho"><a href="/loja.html">Loja</a> &gt; <a href="/loja.html?categoria=${produtoAtual.categoria_slug}">${produtoAtual.categoria_nome}</a> &gt; <span>${produtoAtual.nome}</span></nav>`
                : `<nav class="breadcrumb-produto" aria-label="Caminho"><a href="/loja.html">Loja</a> &gt; <span>${produtoAtual.nome}</span></nav>`;

            const miniaturasHtml = fotos.map((f, i) => `
                <img src="${f}"
                     class="miniatura ${i === 0 ? 'ativa' : ''}"
                     data-url="${f}"
                     onmouseenter="galeriaHover('${f}', this)"
                     onmouseleave="galeriaMouseSai()"
                     onclick="galeriaClique('${f}', this)"
                     alt="Miniatura ${i+1}">
            `).join('');

            c.innerHTML = `
                ${breadcrumb}
                <div class="card-produto novo-produto">
                    <div class="galeria-coluna">
                        <div class="imagem-principal-wrapper" id="imgWrapper">
                            <img id="imagemPrincipal" src="${fotos[0]}" class="imagem-principal" alt="${produtoAtual.nome}">
                            <div id="galeriaHint" class="galeria-hint">Passe o mouse para ver · Clique para travar · Clique novamente para ampliar</div>
                        </div>
                        <div class="miniatura-grid">${miniaturasHtml}</div>
                    </div>

                    <aside class="detalhes-coluna">
                        ${tagsProdutoHtml}
                        <h2 class="titulo-produto">${produtoAtual.nome}</h2>
                        <div id="notaProduto" class="nota-produto">☆☆☆☆☆ 0,0 (0 avaliações)</div>
                        <small class="vendidos-estoque" id="estoqueTexto">${produtoAtual.vendas || 0} vendidos · ${estoqueVarianteAtual()} em estoque</small>

                        <div class="preco-produto">
                            ${produtoAtual.promocao_ativa
                                ? `<del class="preco-riscado">R$ ${moeda(produtoAtual.preco)}</del>
                                   <strong class="preco-destaque">R$ ${moeda(produtoAtual.preco_promocional)}</strong>`
                                : `<strong class="preco-destaque">R$ ${moeda(produtoAtual.preco)}</strong>`
                            }
                        </div>

                        <div class="frete">
                            <b>Frete</b><br>
                            ${produtoAtual.frete_promocao_ativa
                                ? `<del>R$ ${moeda(produtoAtual.frete)}</del> <strong>R$ ${moeda(produtoAtual.frete_promocional)}</strong>`
                                : `R$ ${moeda(produtoAtual.frete)}`
                            }
                        </div>

                        ${produtoAtual.variantes?.length > 1 ? `
                        <select id="varianteSelecionada" class="select-variante" onchange="trocarVariante(this.value)">
                            ${produtoAtual.variantes.map(v => `<option value="${v.nome}">${v.nome}</option>`).join('')}
                        </select>` : ''}

                        <div class="acoes-wrapper">
                            <div class="qtd-grupo">
                                <button type="button" onclick="alterarQtd(-1)">−</button>
                                <input id="quantidade" value="1" readonly>
                                <button type="button" onclick="alterarQtd(1)">+</button>
                            </div>
                            <button class="btn-comprar" onclick="adicionarAoCarrinho()">Comprar</button>
                        </div>
                    </aside>
                </div>

                <section class="detalhes-abaixo">
                    <h3>Descrição</h3>
                    <div>${produtoAtual.descricao || ''}</div>
                    <h3>Especificações e detalhes</h3>
                    <div>${produtoAtual.sobre || ''}</div>
                    <h3>Envio e garantia</h3>
                    <div>${produtoAtual.informacoes || ''}</div>
                </section>

                <section class="avaliacoes">
                    <h2>Avaliações</h2>
                    <div id="comentariosProduto">Carregando avaliações...</div>
                </section>

                <!-- Lightbox -->
                <div id="lightbox" onclick="fecharLightbox()">
                    <img id="imagemAmpliada" alt="Imagem ampliada">
                    <button class="lightbox-fechar" onclick="fecharLightbox()">✕</button>
                </div>
            `;

            carregarAvaliacoes();
        }

        function renderizarTagsProdutoDetalhe(tags) {
            const rotulos = {
                'novo': 'Novo',
                'queima': 'Queima de estoque',
                'exclusivo': 'Exclusivo',
                'promocao-limitada': 'Promoção limitada'
            };
            const lista = Array.isArray(tags) ? tags : [];
            if (!lista.length) return '';
            return `<div class="produto-tags-detalhe">${lista.map(tag => rotulos[tag] ? `<span class="produto-tag ${tag}">${rotulos[tag]}</span>` : '').join('')}</div>`;
        }

        // Hover: só troca se a foto não estiver travada
        function galeriaHover(url, el) {
            if (galeriaFotoTravada) return;
            document.getElementById('imagemPrincipal').src = url;
            document.querySelectorAll('.miniatura').forEach(m => m.classList.remove('ativa'));
            el.classList.add('ativa');
        }

        // Mouse sai da miniatura: volta para a foto travada
        function galeriaMouseSai() {
            if (galeriaFotoTravada) return;
            document.getElementById('imagemPrincipal').src = galeriaUrlTravada;
            // Reativa miniatura correspondente à foto travada
            document.querySelectorAll('.miniatura').forEach(m => {
                m.classList.toggle('ativa', m.dataset.url === galeriaUrlTravada);
            });
        }

        // Clique: se não travado → trava. Se já travado na mesma foto → abre lightbox. Se travado em outra → troca trava.
        function galeriaClique(url, el) {
            if (!galeriaFotoTravada) {
                // 1º clique: trava a foto
                galeriaFotoTravada = true;
                galeriaUrlTravada = url;
                document.getElementById('imagemPrincipal').src = url;
                document.querySelectorAll('.miniatura').forEach(m => m.classList.remove('ativa'));
                el.classList.add('ativa');
                el.classList.add('travada');
            } else if (galeriaUrlTravada === url) {
                // 2º clique na mesma foto travada: amplia
                ampliarFoto(url);
            } else {
                // Clique em outra miniatura enquanto travado: troca a trava
                document.querySelectorAll('.miniatura').forEach(m => m.classList.remove('travada', 'ativa'));
                galeriaUrlTravada = url;
                document.getElementById('imagemPrincipal').src = url;
                el.classList.add('ativa', 'travada');
            }
        }

        function ampliarFoto(url) {
            const urlFinal = url || document.getElementById('imagemPrincipal').src;
            document.getElementById('imagemAmpliada').src = urlFinal;
            document.getElementById('lightbox').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        function fecharLightbox() {
            document.getElementById('lightbox').style.display = 'none';
            document.body.style.overflow = '';
        }

        // Fecha lightbox com ESC
        document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharLightbox(); });

        function stars(n) { return '★★★★★'.split('').map((x, i) => i < Math.round(n) ? x : '☆').join(''); }
        carregarProduto();
        
    </script>
</body>
