    <header class="header-loja">
        <h1>Core Case</h1>
        <div class="header-links">
            <a href="/index.html">home</a>
            <a href="/loja.html" class="active">loja</a>
            <a href="/cart.html">carrinho</a>
           <div id="menu-usuario" style="display:inline-block;"></div>

    <main class="main-container">
        <div id="detalhes-container">
            <div class="card-estado">
                <p style="color: #666666; font-size: 15px; margin: 0;">Carregando detalhes do produto...</p>
            </div>
        </div>
    </main>

    </footer>
<script src="/usuario.js"></script>
<script src="/avaliacoes-ui.js"></script>
    <script>
        function moeda(valor) {
            return Number(valor || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        let produtoAtual = null;
        let quantidadeSelecionada = 1;

        async function carregarProduto() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                window.location.href = '/loja.html';
                return;
            }

            try {
                const res = await fetch(`/api/produtos/${id}`);
                if (!res.ok) throw new Error('Produto não encontrado');
                produtoAtual = await res.json();
                renderizarProduto();
                if (typeof rastrearVisualizacaoProduto === 'function') rastrearVisualizacaoProduto(produtoAtual);
            } catch (erro) {
                document.getElementById('detalhes-container').innerHTML = `
                    <div class="card-estado">
                        <h3>Produto não encontrado ou indisponível.</h3>
                        <p><a href="/loja.html">Voltar para o catálogo da loja</a></p>
                    </div>
                `;
            }
        }

        function lerFotos(produto) {
            try {
                const fotos = JSON.parse(produto.foto || '[]');
                return Array.isArray(fotos) && fotos.length > 0 ? fotos : [produto.foto || 'https://via.placeholder.com/400?text=Core+Case'];
            } catch (e) {
                return produto.foto ? [produto.foto] : ['https://via.placeholder.com/400?text=Core+Case'];
            }
        }

        function renderizarProdutoOriginal() {
            const fotos = lerFotos(produtoAtual);
            const container = document.getElementById('detalhes-container');

            const miniaturasHtml = fotos.map((f, i) => `
                <img src="${f}" class="miniatura ${i === 0 ? 'ativa' : ''}" onclick="trocarFoto('${f}', this)" alt="Miniatura ${i+1}">
            `).join('');

            container.innerHTML = `
                <div class="card-produto">
                    <!-- Coluna da Esquerda: Galeria de Imagens -->
                    <div class="galeria-coluna">
                        <div class="imagem-principal-wrapper">
                            <img id="imagemPrincipal" src="${fotos[0]}" class="imagem-principal" alt="${produtoAtual.nome}">
                        </div>
                        <div class="miniatura-grid">
                            ${miniaturasHtml}
                        </div>
                    </div>

                    <!-- Coluna da Direita: Informações e Ações -->
                    <div class="detalhes-coluna">
                        <h2 class="titulo-produto">${produtoAtual.nome}</h2>
                        
                        <div class="preco-produto">
                            R$ ${moeda(produtoAtual.preco)}
                        </div>

                        <p class="descricao-produto">
                            ${produtoAtual.descricao || 'Sem descrição curta disponível.'}
                        </p>

                        <div class="bloco-info">
                            <h3>Especificações Técnicas</h3>
                            <p>${produtoAtual.sobre || 'Nenhuma especificação informada.'}</p>
                        </div>

                        <div class="bloco-info">
                            <h3>Informações de Envio e Garantia</h3>
                            <p>${produtoAtual.informacoes || 'Consulte as condições de frete e garantia no fechamento do pedido.'}</p>
                        </div>

                        ${(produtoAtual.variantes && produtoAtual.variantes.length > 1) ? `
                        <div class="bloco-info">
                            <h3>Versão / Modelo</h3>
                            <select id="varianteSelecionada" class="select-variante" style="margin-top:8px; width:100%;">
                                ${produtoAtual.variantes.map(v => `<option value="${v}">${v}</option>`).join('')}
                            </select>
                        </div>
                        ` : ''}

                        <div class="acoes-wrapper">
                            <div class="qtd-grupo">
                                <button type="button" onclick="alterarQtd(-1)">-</button>
                                <input type="text" id="quantidade" value="1" readonly>
                                <button type="button" onclick="alterarQtd(1)">+</button>
                            </div>
                            
                            <button class="btn-comprar" onclick="adicionarAoCarrinho()">
                                Adicionar ao Carrinho
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function trocarFoto(url, elemento) {
            document.getElementById('imagemPrincipal').src = url;
            document.querySelectorAll('.miniatura').forEach(img => {
                img.classList.remove('ativa');
            });
            elemento.classList.add('ativa');
        }

        function alterarQtd(delta) {
            quantidadeSelecionada = Math.max(1, quantidadeSelecionada + delta);
            const input = document.getElementById('quantidade');
            if (input) input.value = quantidadeSelecionada;
        }


// Atualize a sua função adicionarAoCarrinho existente para usar a nova lógica:
function adicionarAoCarrinho() {
    if (!produtoAtual) return;

    const seletorVariante = document.getElementById('varianteSelecionada');
    const variante = seletorVariante ? seletorVariante.value : (produtoAtual.variantes && produtoAtual.variantes[0]) || 'Padrão';

    const sucesso = adicionarItemAoCarrinho({
        id: produtoAtual.id,
        nome: produtoAtual.nome,
        preco: (produtoAtual.promocao_ativa && Number(produtoAtual.preco_promocional) > 0) ? produtoAtual.preco_promocional : produtoAtual.preco,
        foto: lerFotos(produtoAtual)[0],
        qtd: quantidadeSelecionada,
        variante: variante
    });

    if (sucesso) window.location.href = '/cart.html';
}

        // Interface de compra: mantém os dados existentes, mas coloca ação e preço
        // na lateral e os detalhes logo abaixo da galeria.
        function renderizarProduto() {
            const fotos = lerFotos(produtoAtual), c = document.getElementById('detalhes-container');
            c.innerHTML = `<div class="card-produto novo-produto"><div class="galeria-coluna"><div class="imagem-principal-wrapper"><img id="imagemPrincipal" src="${fotos[0]}" class="imagem-principal" onclick="ampliarFoto()" alt="${produtoAtual.nome}"></div><div class="miniatura-grid">${fotos.map((f,i)=>`<img src="${f}" class="miniatura ${i?'':'ativa'}" onmouseenter="trocarFoto('${f}',this)" onclick="trocarFoto('${f}',this)" alt="Miniatura ${i+1}">`).join('')}</div></div><aside class="detalhes-coluna"><h2 class="titulo-produto">${produtoAtual.nome}</h2><div id="notaProduto" class="nota-produto">☆☆☆☆☆ 0,0 (0 avaliações)</div><small>${produtoAtual.vendas || 0} vendidos · ${produtoAtual.estoque || 0} em estoque</small><div class="preco-produto">${produtoAtual.promocao_ativa?`<del>R$ ${moeda(produtoAtual.preco)}</del>`:''}<strong>R$ ${moeda(produtoAtual.promocao_ativa?produtoAtual.preco_promocional:produtoAtual.preco)}</strong></div><div class="frete"><b>Frete</b><br>${produtoAtual.frete_promocao_ativa?`<del>R$ ${moeda(produtoAtual.frete)}</del> <strong>R$ ${moeda(produtoAtual.frete_promocional)}</strong>`:`R$ ${moeda(produtoAtual.frete)}`}</div>${produtoAtual.variantes?.length>1?`<select id="varianteSelecionada" class="select-variante">${produtoAtual.variantes.map(v=>`<option>${v}</option>`).join('')}</select>`:''}<div class="acoes-wrapper"><div class="qtd-grupo"><button onclick="alterarQtd(-1)">-</button><input id="quantidade" value="1" readonly><button onclick="alterarQtd(1)">+</button></div><button class="btn-comprar" onclick="adicionarAoCarrinho()">Comprar</button></div></aside></div><section class="detalhes-abaixo"><h3>Descrição</h3><div>${produtoAtual.descricao||''}</div><h3>Especificações e detalhes</h3><div>${produtoAtual.sobre||''}</div><h3>Envio e garantia</h3><div>${produtoAtual.informacoes||''}</div></section><section class="avaliacoes"><h2>Avaliações</h2><div id="comentariosProduto">Carregando avaliações...</div></section><div id="lightbox" onclick="this.style.display='none'"><img id="imagemAmpliada"></div>`;
            carregarAvaliacoes();
        }
        function ampliarFoto(){ const a=document.getElementById('imagemAmpliada'), l=document.getElementById('lightbox'); a.src=document.getElementById('imagemPrincipal').src;l.style.display='flex'; }
        function stars(n){return '★★★★★'.split('').map((x,i)=>i<Math.round(n)?x:'☆').join('')}
        carregarProduto();
        
    </script>
</body>
