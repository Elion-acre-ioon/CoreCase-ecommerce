<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Case - Detalhes do Produto</title>
    <link rel="stylesheet" href="/produto.css">
</head>
<body>
    <header class="header-loja">
        <h1>Core Case</h1>
        <div class="header-links">
            <a href="/index.html">home</a>
            <a href="/loja.html" class="active">loja</a>
            <a href="/cart.html">carrinho</a>
           <div id="menu-usuario" style="display:inline-block;"></div>
        </div>
    </header>

    <main class="main-container">
        <div id="detalhes-container">
            <div class="card-estado">
                <p style="color: #666666; font-size: 15px; margin: 0;">Carregando detalhes do produto...</p>
            </div>
        </div>
    </main>

    <footer class="footer-loja">
        <p>&copy; 2026 <span>Core Case</span>. Todos os direitos reservados. Qualidade e proteção premium para o seu dispositivo.</p>
    </footer>
<script src="/usuario.js"></script>
    <script>
        function moeda(valor) {
            return Number(valor || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        let produtoAtual = null;
        let quantidadeSelecionada = 1;

        async function carregarProduto() {
            const params = new URLSearchParams(window.location.search);
            const id = params.get('id');

            if (!id) {
                window.location.href = '/loja.html';
                return;
            }

            try {
                const res = await fetch(`/api/produtos/${id}`);
                if (!res.ok) throw new Error('Produto não encontrado');
                produtoAtual = await res.json();
                renderizarProduto();
            } catch (erro) {
                document.getElementById('detalhes-container').innerHTML = `
                    <div class="card-estado">
                        <h3>Produto não encontrado ou indisponível.</h3>
                        <p><a href="/loja.html">Voltar para o catálogo da loja</a></p>
                    </div>
                `;
            }
        }

        function lerFotos(produto) {
            try {
                const fotos = JSON.parse(produto.foto || '[]');
                return Array.isArray(fotos) && fotos.length > 0 ? fotos : [produto.foto || 'https://via.placeholder.com/400?text=Core+Case'];
            } catch (e) {
                return produto.foto ? [produto.foto] : ['https://via.placeholder.com/400?text=Core+Case'];
            }
        }

        function renderizarProduto() {
            const fotos = lerFotos(produtoAtual);
            const container = document.getElementById('detalhes-container');

            const miniaturasHtml = fotos.map((f, i) => `
                <img src="${f}" class="miniatura ${i === 0 ? 'ativa' : ''}" onclick="trocarFoto('${f}', this)" alt="Miniatura ${i+1}">
            `).join('');

            container.innerHTML = `
                <div class="card-produto">
                    <!-- Coluna da Esquerda: Galeria de Imagens -->
                    <div class="galeria-coluna">
                        <div class="imagem-principal-wrapper">
                            <img id="imagemPrincipal" src="${fotos[0]}" class="imagem-principal" alt="${produtoAtual.nome}">
                        </div>
                        <div class="miniatura-grid">
                            ${miniaturasHtml}
                        </div>
                    </div>

                    <!-- Coluna da Direita: Informações e Ações -->
                    <div class="detalhes-coluna">
                        <h2 class="titulo-produto">${produtoAtual.nome}</h2>
                        
                        <div class="preco-produto">
                            R$ ${moeda(produtoAtual.preco)}
                        </div>

                        <p class="descricao-produto">
                            ${produtoAtual.descricao || 'Sem descrição curta disponível.'}
                        </p>

                        <div class="bloco-info">
                            <h3>Especificações Técnicas</h3>
                            <p>${produtoAtual.sobre || 'Nenhuma especificação informada.'}</p>
                        </div>

                        <div class="bloco-info">
                            <h3>Informações de Envio e Garantia</h3>
                            <p>${produtoAtual.informacoes || 'Consulte as condições de frete e garantia no fechamento do pedido.'}</p>
                        </div>

                        <div class="acoes-wrapper">
                            <div class="qtd-grupo">
                                <button type="button" onclick="alterarQtd(-1)">-</button>
                                <input type="text" id="quantidade" value="1" readonly>
                                <button type="button" onclick="alterarQtd(1)">+</button>
                            </div>
                            
                            <button class="btn-comprar" onclick="adicionarAoCarrinho()">
                                Adicionar ao Carrinho
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function trocarFoto(url, elemento) {
            document.getElementById('imagemPrincipal').src = url;
            document.querySelectorAll('.miniatura').forEach(img => {
                img.classList.remove('ativa');
            });
            elemento.classList.add('ativa');
        }

        function alterarQtd(delta) {
            quantidadeSelecionada = Math.max(1, quantidadeSelecionada + delta);
            const input = document.getElementById('quantidade');
            if (input) input.value = quantidadeSelecionada;
        }


// Atualize a sua função adicionarAoCarrinho existente para usar a nova lógica:
function adicionarAoCarrinho() {
    if (!produtoAtual) return;

    const sucesso = adicionarItemAoCarrinho({
        id: produtoAtual.id,
        nome: produtoAtual.nome,
        preco: produtoAtual.preco,
        foto: lerFotos(produtoAtual)[0],
        qtd: quantidadeSelecionada
    });

    if (sucesso) window.location.href = '/cart.html';
}

        carregarProduto();
        
    </script>
</body>
</html>
