<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="/analytics.js" defer></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Case - Loja</title>
    <link rel="stylesheet" href="/style.css?v=corecase-20260807b">
    <style>
        .loja-shell { width:100%; max-width:1240px; margin:28px auto 44px; padding:0 20px; box-sizing:border-box; }
        .loja-layout { display:block; width:100%; min-width:0; }
        .categoria-lista { display:flex; flex-direction:column; gap:6px; }
        .categoria-btn { width:100%; min-height:40px; background:transparent; color:#334155; text-align:left; text-transform:none; border-radius:6px; padding:10px 12px; font-size:14px; display:flex; justify-content:space-between; gap:10px; }
        .categoria-btn:hover, .categoria-btn.ativa { background:#f8fafc; color:var(--vermelho-core); }
        .loja-topo { background:#fff; border:1px solid var(--borda-clara); border-radius:8px; padding:18px; margin-bottom:18px; }
        .loja-controles { display:grid; grid-template-columns: minmax(0,1fr) minmax(170px, 210px); gap:12px; align-items:center; }
        .loja-controles input, .loja-controles select { min-height:46px; }
        .loja-meta { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-top:12px; color:#64748b; font-size:14px; }
        .categorias-mobile { display:none; gap:8px; overflow-x:auto; padding:2px 0 12px; scrollbar-width:none; }
        .categorias-mobile::-webkit-scrollbar { display:none; }
        .chip-categoria { flex:0 0 auto; border:1px solid #e2e8f0; background:#fff; color:#334155; border-radius:999px; padding:9px 13px; width:auto; min-height:38px; text-transform:none; }
        .chip-categoria.ativa { background:#111; color:#fff; }
        .mobile-actions { display:none; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:14px; }
        .loja-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap:18px; }
        .produto-card-vitrine { min-width:0; }
        .produto-imagem-wrap { position:relative; margin-bottom:14px; background:#fff; }
        .produto-card-vitrine img { object-fit:contain; background:#fff; margin-bottom:0; }
        .produto-card-vitrine h3 { overflow-wrap:anywhere; }
        .preco-card { margin:4px 0 12px; min-height:46px; }
        .preco-card .preco-original { display:block; font-size:12px; color:#777; text-decoration:line-through; margin-bottom:2px; }
        .preco-card .preco-atual { display:block; font-size:20px; font-weight:800; color:var(--vermelho-core); line-height:1.15; }
        .preco-card:not(.promocional) .preco-atual { color:#111; }
        .produto-acoes { display:flex; flex-direction:column; gap:8px; }
        .btn-carrinho-vitrine { background:#222; }
        .produto-tags-overlay { position:absolute; top:8px; left:8px; right:8px; display:flex; flex-wrap:wrap; gap:6px; pointer-events:none; }
        .produto-tag { color:#fff; font-size:11px; line-height:1; font-weight:800; text-transform:uppercase; padding:6px 8px; border-radius:4px; box-shadow:0 2px 8px rgba(0,0,0,.18); }
        .produto-tag.novo { background:#c62828; } .produto-tag.queima { background:#2563eb; } .produto-tag.exclusivo { background:#b8860b; } .produto-tag.promocao-limitada { background:#111; }
        .drawer-categorias { display:none; position:fixed; inset:0; z-index:5000; background:rgba(0,0,0,.45); }
        .drawer-categorias.aberto { display:block; }
        .drawer-painel { position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:16px 16px 0 0; padding:18px; max-height:78vh; overflow:auto; }
        .drawer-topo { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .drawer-topo h2 { margin:0; font-size:20px; }
        .btn-fechar-drawer { width:auto; min-height:38px; padding:8px 12px; background:#111; }
        .skeleton-card { min-height:320px; overflow:hidden; position:relative; }
        .skeleton-card::before { content:""; display:block; height:180px; border-radius:6px; background:linear-gradient(90deg,#eef2f7,#f8fafc,#eef2f7); background-size:220% 100%; animation:skeletonPulse 1.1s infinite linear; margin-bottom:14px; }
        .skeleton-line { height:14px; border-radius:999px; background:#eef2f7; margin:10px 0; }
        .skeleton-line.curta { width:55%; }
        @keyframes skeletonPulse { from { background-position:100% 0; } to { background-position:-100% 0; } }
        .loja-erro { grid-column:1/-1; text-align:center; }
        @media (max-width: 900px) {
            .loja-shell { margin:18px auto 34px; padding:0 12px; }
            .loja-layout { display:block; }
            .categorias-mobile { display:flex; }
            .mobile-actions { display:grid; }
            .loja-controles { grid-template-columns:1fr; }
            .loja-grid { grid-template-columns: repeat(2, minmax(0,1fr)); gap:12px; }
            .produto-acoes button { min-height:38px; padding:9px 8px; font-size:11px; line-height:1.15; }
            .produto-tag { font-size:9px; padding:5px 6px; }
        }
        @media (min-width: 900px) and (max-width: 1199px) { .loja-grid { grid-template-columns: repeat(3, minmax(0,1fr)); } }
        @media (min-width: 1200px) { .loja-grid { grid-template-columns: repeat(4, minmax(0,1fr)); } }
    </style>
</head>
<body>
    <main class="loja-shell">
        <div class="categorias-mobile" id="categoriasMobile"></div>
        <div class="mobile-actions">
            <button type="button" onclick="abrirDrawerCategorias()" aria-controls="drawerCategorias" aria-expanded="false" id="btnCategoriasMobile">Categorias</button>
            <select id="ordemMobile" aria-label="Ordenar produtos" onchange="alterarOrdem(this.value)"></select>
        </div>
        <div class="loja-layout">
            <section>
                <div class="loja-topo">
                    <div class="loja-controles">
                        <input type="search" id="busca" placeholder="Pesquisar produtos" oninput="alterarBusca(this.value)" aria-label="Pesquisar produtos">
                        <select id="ordem" aria-label="Ordenar produtos" onchange="alterarOrdem(this.value)">
                            <option value="padrao">Padrao</option>
                            <option value="menor-preco">Menor preco</option>
                            <option value="maior-preco">Maior preco</option>
                            <option value="mais-recentes">Mais recentes</option>
                        </select>
                    </div>
                    <div class="loja-meta"><strong id="tituloResultado">Todos os produtos</strong><span id="contadorProdutos">Carregando...</span></div>
                </div>
                <div id="lista-produtos" class="loja-grid"></div>
            </section>
        </div>
    </main>
    <div class="drawer-categorias" id="drawerCategorias" onclick="fecharDrawerFora(event)">
        <div class="drawer-painel" role="dialog" aria-modal="true" aria-labelledby="tituloDrawerCategorias">
            <div class="drawer-topo"><h2 id="tituloDrawerCategorias">Categorias</h2><button type="button" class="btn-fechar-drawer" onclick="fecharDrawerCategorias()">X</button></div>
            <div class="categoria-lista" id="categoriasDrawer"></div>
            <button type="button" style="margin-top:14px;" onclick="fecharDrawerCategorias()">Ver produtos</button>
        </div>
    </div>
    <footer class="rodape"><div class="rodape-legal">Core Case | CEP: 74394-615 | CPF: 093.791.283-20 | Politica de entrega: em ate 20 dias uteis | Politica de devolucao de acordo com o Codigo de Defesa do Consumidor.</div></footer>
    <script src="/header.js"></script>
    <script src="/usuario.js"></script>
    <script>
        let produtos = [];
        let categorias = [];
        const TIMEOUT_LOJA_MS = 12000;

        function paramsAtuais() { return new URLSearchParams(window.location.search); }
        function categoriaAtual() { return paramsAtuais().get('categoria') || 'todos'; }
        function buscaAtual() { return paramsAtuais().get('busca') || ''; }
        function ordemAtual() { return paramsAtuais().get('ordem') || 'padrao'; }
        function atualizarUrl(changes) {
            const p = paramsAtuais();
            Object.entries(changes).forEach(([k,v]) => v ? p.set(k, v) : p.delete(k));
            const qs = p.toString();
            history.pushState(null, '', qs ? `/loja.html?${qs}` : '/loja.html');
            renderizarLoja();
        }
        function alterarBusca(valor) { atualizarUrl({ busca: valor.trim() }); }
        function alterarOrdem(valor) { atualizarUrl({ ordem: valor === 'padrao' ? '' : valor }); }
        function selecionarCategoria(slug) {
            atualizarUrl({ categoria: slug === 'todos' ? '' : slug });
            fecharDrawerCategorias();
            window.dispatchEvent(new CustomEvent('corecase:categoria-alterada'));
        }

        function produtoEmPromocaoValida(produto) {
            const normal = Number(produto.preco || 0);
            const promocional = Number(produto.preco_promocional || 0);
            return Boolean(produto.promocao_ativa) && promocional > 0 && promocional < normal;
        }

        function precoEfetivoProduto(produto) {
            const normal = Number(produto.preco || 0);
            const promocional = Number(produto.preco_promocional || 0);
            return produtoEmPromocaoValida(produto) ? promocional : normal;
        }

        function moeda(valor) {
            return Number(valor || 0).toLocaleString('pt-BR', { style:'currency', currency:'BRL' });
        }

        function htmlPrecoProduto(produto) {
            if (produtoEmPromocaoValida(produto)) {
                return `<div class="preco-card promocional"><span class="preco-original">${moeda(produto.preco)}</span><strong class="preco-atual">${moeda(precoEfetivoProduto(produto))}</strong></div>`;
            }
            return `<div class="preco-card"><strong class="preco-atual">${moeda(produto.preco)}</strong></div>`;
        }

        function imagemCloudinary(url, largura = 500) {
            const valor = String(url || '');
            if (!valor.includes('res.cloudinary.com') || !valor.includes('/upload/')) return valor;
            return valor.replace('/upload/', `/upload/f_auto,q_auto,c_limit,w_${largura}/`);
        }

        async function fetchComTimeout(url, opcoes = {}) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), opcoes.timeout || TIMEOUT_LOJA_MS);
            try {
                return await fetch(url, { ...opcoes, signal: controller.signal });
            } finally {
                clearTimeout(timer);
            }
        }

        function renderizarSkeleton() {
            document.getElementById('lista-produtos').innerHTML = Array.from({ length: 8 }).map(() => `
                <div class="card skeleton-card" aria-hidden="true">
                    <div class="skeleton-line"></div>
                    <div class="skeleton-line curta"></div>
                </div>
            `).join('');
        }

        async function inicializarLoja() {
            const inicio = performance.now();
            renderizarSkeleton();
            try {
                const resBootstrap = await fetchComTimeout('/api/loja/bootstrap');
                if (!resBootstrap.ok) throw new Error('Falha ao carregar loja.');
                const bootstrap = await resBootstrap.json();
                produtos = Array.isArray(bootstrap.produtos) ? bootstrap.produtos : [];
                categorias = Array.isArray(bootstrap.categorias) ? bootstrap.categorias : [];
            } catch (erro) {
                document.getElementById('contadorProdutos').innerText = 'Erro ao carregar';
                document.getElementById('lista-produtos').innerHTML = '<div class="card loja-erro"><h3>Nao foi possivel carregar os produtos.</h3><p>Tente novamente em instantes.</p><button type="button" onclick="inicializarLoja()">Tentar novamente</button></div>';
                console.warn('[perf] loja_bootstrap_erro', erro.message);
                return;
            }
            console.log(`[perf] loja_bootstrap_ms=${Math.round(performance.now() - inicio)}`);
            window.coreCaseProdutosCount = Array.isArray(produtos) ? produtos.length : 0;
            window.coreCaseCategorias = categorias;
            window.dispatchEvent(new CustomEvent('corecase:produtos-carregados'));
            window.dispatchEvent(new CustomEvent('corecase:categorias-carregadas'));
            document.getElementById('busca').value = buscaAtual();
            document.getElementById('ordem').value = ordemAtual();
            document.getElementById('ordemMobile').innerHTML = document.getElementById('ordem').innerHTML;
            document.getElementById('ordemMobile').value = ordemAtual();
            renderizarCategorias();
            renderizarLoja();
        }

        function listaCategoriasComTodos() {
            return [{ id: 0, nome: 'Todos', slug: 'todos', produtos: produtos.length }, ...(Array.isArray(categorias) ? categorias : [])];
        }
        function botaoCategoria(c, classe='categoria-btn') {
            const ativa = categoriaAtual() === c.slug || (categoriaAtual() === 'todos' && c.slug === 'todos');
            return `<button type="button" class="${classe} ${ativa ? 'ativa' : ''}" onclick="selecionarCategoria('${c.slug}')" aria-pressed="${ativa}"><span>${c.nome}</span><small>${c.produtos || 0}</small></button>`;
        }
        function renderizarCategorias() {
            const html = listaCategoriasComTodos().map(c => botaoCategoria(c)).join('');
            const drawer = document.getElementById('categoriasDrawer');
            const mobile = document.getElementById('categoriasMobile');
            if (drawer) drawer.innerHTML = html;
            if (mobile) mobile.innerHTML = listaCategoriasComTodos().map(c => botaoCategoria(c, 'chip-categoria')).join('');
        }
        function produtosFiltrados() {
            const cat = categoriaAtual();
            const busca = buscaAtual().toLowerCase();
            let lista = produtos.filter(p => {
                const okCat = cat === 'todos' || p.categoria_slug === cat;
                const okBusca = !busca || String(p.nome || '').toLowerCase().includes(busca) || String(p.descricao || '').toLowerCase().includes(busca);
                return okCat && okBusca;
            });
            const ordem = ordemAtual();
            if (ordem === 'menor-preco') lista.sort((a,b) => precoEfetivoProduto(a) - precoEfetivoProduto(b));
            if (ordem === 'maior-preco') lista.sort((a,b) => precoEfetivoProduto(b) - precoEfetivoProduto(a));
            if (ordem === 'mais-recentes') lista.sort((a,b) => Number(b.id || 0) - Number(a.id || 0));
            return lista;
        }
        function renderizarLoja() {
            let cat = listaCategoriasComTodos().find(c => c.slug === categoriaAtual()) || listaCategoriasComTodos()[0];
            if (!cat || (categoriaAtual() !== 'todos' && !categorias.some(c => c.slug === categoriaAtual()))) {
                history.replaceState(null, '', '/loja.html');
                cat = listaCategoriasComTodos()[0];
            }
            document.getElementById('busca').value = buscaAtual();
            document.getElementById('ordem').value = ordemAtual();
            document.getElementById('ordemMobile').value = ordemAtual();
            renderizarCategorias();
            const lista = produtosFiltrados();
            document.getElementById('tituloResultado').innerText = cat?.nome || 'Todos os produtos';
            document.getElementById('contadorProdutos').innerText = `${lista.length} produto(s)`;
            document.getElementById('lista-produtos').innerHTML = lista.length ? lista.map(cardProduto).join('') : '<div class="card" style="grid-column:1/-1;text-align:center;"><h3>Nenhum produto encontrado.</h3></div>';
        }
        function primeiraFoto(p) { try { const arr = JSON.parse(p.foto || '[]'); return Array.isArray(arr) ? arr[0] : p.foto; } catch(e) { return p.foto; } }
        function cardProduto(p, indice = 0) {
            const foto = primeiraFoto(p) || 'https://via.placeholder.com/300?text=Core+Case';
            const fotoCard = imagemCloudinary(foto, 500);
            const prioridade = indice === 0 ? 'loading="eager" fetchpriority="high"' : 'loading="lazy"';
            return `<div class="card produto-card-vitrine"><div class="produto-imagem-wrap"><img src="${fotoCard}" alt="${p.nome}" width="500" height="500" ${prioridade} decoding="async" onerror="this.src='https://via.placeholder.com/300?text=Core+Case'">${renderizarTagsProduto(p.produto_tags)}</div><h3>${p.nome}</h3>${htmlPrecoProduto(p)}<div class="produto-acoes"><button onclick="verProduto(${p.id})">Visualizar detalhes</button><button class="btn-carrinho-vitrine" onclick="adicionarAoCarrinhoPorId(${p.id})">Adicionar ao carrinho</button></div></div>`;
        }
        function renderizarTagsProduto(tags) {
            const rotulos = { novo:'Novo', queima:'Queima de estoque', exclusivo:'Exclusivo', 'promocao-limitada':'Promocao limitada' };
            const lista = Array.isArray(tags) ? tags : [];
            return lista.length ? `<div class="produto-tags-overlay">${lista.map(t => rotulos[t] ? `<span class="produto-tag ${t}">${rotulos[t]}</span>` : '').join('')}</div>` : '';
        }
        function adicionarAoCarrinhoPorId(id) {
            const produto = produtos.find(p => Number(p.id) === Number(id));
            if (!produto) return;
            if (adicionarItemAoCarrinho({ id: produto.id, nome: produto.nome, preco: precoEfetivoProduto(produto), foto: primeiraFoto(produto) })) {
                alert('Produto adicionado ao carrinho!');
            }
        }
        function verProduto(id) { window.location.href = `/produto.html?id=${id}`; }
        function abrirDrawerCategorias() { document.getElementById('drawerCategorias').classList.add('aberto'); document.getElementById('btnCategoriasMobile').setAttribute('aria-expanded','true'); }
        function fecharDrawerCategorias() { document.getElementById('drawerCategorias').classList.remove('aberto'); document.getElementById('btnCategoriasMobile').setAttribute('aria-expanded','false'); }
        function fecharDrawerFora(e) { if (e.target.id === 'drawerCategorias') fecharDrawerCategorias(); }
        window.addEventListener('popstate', renderizarLoja);
        inicializarLoja();
    </script>
</body>
</html>
