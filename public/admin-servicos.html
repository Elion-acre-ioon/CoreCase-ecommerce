<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Core Case Admin - Fila</title>
    <link rel="stylesheet" href="/style.css?v=corecase-20260807b">
    <link rel="stylesheet" href="/admin-style.css">
</head>
<body>
    <main class="admin-container">
        <header class="admin-page-heading">
            <div><span class="admin-kicker">CORECASE_ADMIN / FILA</span><h2>Fila operacional</h2></div>
            <p class="muted">Pedidos recebidos e solicitações de reembolso persistidas.</p>
        </header>
        <section class="admin-card">
            <div class="fila-toolbar">
                <div class="admin-filtros" role="group" aria-label="Filtrar fila">
                    <button type="button" class="active" data-filtro-fila="todos">Todos</button>
                    <button type="button" data-filtro-fila="pedidos">Pedidos</button>
                    <button type="button" data-filtro-fila="reembolsos">Reembolsos</button>
                </div>
                <strong id="contadorReembolsos" class="fila-contador">Reembolsos pendentes: 0</strong>
            </div>
            <div id="fila" aria-live="polite"></div>
        </section>
    </main>

    <script src="/admin.js"></script>
    <script src="/admin-servicos.js"></script>
</body>
</html>
