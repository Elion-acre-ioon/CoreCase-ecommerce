<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Core Case Admin - Produtos</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="stylesheet" href="/admin-style.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-card">
            <h2 id="titulo-form">Cadastrar produto</h2>
            <form onsubmit="salvarProduto(event)">
                <input type="hidden" id="produtoId">

                <div class="linha-dupla">
                    <div class="form-group">
                        <label>Nome do produto</label>
                        <input type="text" id="pNome" required>
                    </div>
                    <div class="form-group">
                        <label>Preco de venda (R$)</label>
                        <input type="number" step="0.01" id="pPreco" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Descricao curta</label>
                    <textarea id="pDesc" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Especificacoes detalhadas</label>
                    <textarea id="pSobre" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Informacoes de envio e garantia</label>
                    <input type="text" id="pInfo" required>
                </div>

                <div class="linha-dupla">
                    <div class="form-group">
                        <label>Quantidade maxima de parcelas</label>
                        <input type="number" id="pMaxParcelas" value="12" min="1" required>
                    </div>
                    <div class="form-group">
                        <label>Juros mensais (%)</label>
                        <input type="number" step="0.01" id="pJuros" value="0.00" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Fotos do produto</label>
                    <input type="file" id="pInputFoto" accept="image/*" multiple onchange="converterMultiplasImagens(event)">
                    <small class="muted">Ao editar, escolha novas fotos apenas se quiser acrescentar imagens ao produto.</small>
                </div>

                <div id="fotosAtuais" class="muted" style="margin-bottom: 16px;"></div>

                <div class="admin-actions" style="justify-content:flex-start;">
                    <button type="submit" class="btn-gravar" style="max-width:260px;">Salvar produto</button>
                    <button type="button" class="btn-neutro btn-pequeno" onclick="limparFormulario()">Novo produto</button>
                </div>
            </form>
        </div>

        <div class="admin-card">
            <h2>Produtos cadastrados</h2>
            <div id="listaProdutos" class="produto-lista"></div>
        </div>
    </div>

    <script src="/admin.js"></script>
    <script>
        montarNavAdmin('produtos');

        let listaFotosBase64 = [];
        let fotosExistentes = [];

        function converterMultiplasImagens(event) {
            listaFotosBase64 = [];
            const arquivos = Array.from(event.target.files || []);

            arquivos.forEach(arquivo => {
                const reader = new FileReader();
                reader.onload = e => listaFotosBase64.push(e.target.result);
                reader.readAsDataURL(arquivo);
            });
        }

        function lerFotos(produto) {
            try {
                const fotos = JSON.parse(produto.foto || '[]');
                return Array.isArray(fotos) ? fotos : [produto.foto];
            } catch (e) {
                return produto.foto ? [produto.foto] : [];
            }
        }

        async function salvarProduto(event) {
            event.preventDefault();
            const id = document.getElementById('produtoId').value;
            const payload = {
                nome: document.getElementById('pNome').value,
                preco: parseFloat(document.getElementById('pPreco').value),
                descricao: document.getElementById('pDesc').value,
                sobre: document.getElementById('pSobre').value,
                informacoes: document.getElementById('pInfo').value,
                max_parcelas: parseInt(document.getElementById('pMaxParcelas').value) || 12,
                juros_mensal: parseFloat(document.getElementById('pJuros').value) || 0,
                fotosBase64: listaFotosBase64,
                fotosExistentes
            };

            if (!id && listaFotosBase64.length === 0) {
                alert('Selecione pelo menos uma foto para cadastrar o produto.');
                return;
            }

            const resposta = await adminFetch(id ? `/api/produtos/${id}` : '/api/produtos', {
                method: id ? 'PUT' : 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const dados = await resposta.json();
            if (!resposta.ok || dados.erro) {
                alert(dados.erro || 'Nao foi possivel salvar o produto.');
                return;
            }

            alert('Produto salvo com sucesso.');
            limparFormulario();
            carregarProdutos();
        }

        async function carregarProdutos() {
            const res = await fetch('/api/produtos');
            const produtos = await res.json();
            const container = document.getElementById('listaProdutos');

            if (!produtos.length) {
                container.innerHTML = '<p class="muted">Nenhum produto cadastrado ainda.</p>';
                return;
            }

            container.innerHTML = produtos.map(produto => {
                const foto = primeiraFotoProduto(produto);
                return `
                    <div class="admin-row">
                        <img src="${foto}" alt="${produto.nome}" onerror="this.src='https://via.placeholder.com/120?text=Core'">
                        <div>
                            <strong>${produto.nome}</strong>
                            <div class="muted">R$ ${moeda(produto.preco)} | ${produto.max_parcelas}x | juros ${produto.juros_mensal}%</div>
                            <div class="muted">${produto.descricao || ''}</div>
                        </div>
                        <div class="admin-actions">
                            <button class="btn-neutro" onclick="editarProduto(${produto.id})">Editar</button>
                            <button class="btn-perigo" onclick="excluirProduto(${produto.id})">Excluir</button>
                        </div>
                    </div>
                `;
            }).join('');

            const editar = new URLSearchParams(window.location.search).get('editar');
            if (editar) {
                history.replaceState(null, '', '/admin-produtos.html');
                editarProduto(editar);
            }
        }

        async function editarProduto(id) {
            const res = await fetch(`/api/produtos/${id}`);
            const produto = await res.json();
            fotosExistentes = lerFotos(produto);
            listaFotosBase64 = [];

            document.getElementById('titulo-form').innerText = 'Editar produto';
            document.getElementById('produtoId').value = produto.id;
            document.getElementById('pNome').value = produto.nome || '';
            document.getElementById('pPreco').value = produto.preco || 0;
            document.getElementById('pDesc').value = produto.descricao || '';
            document.getElementById('pSobre').value = produto.sobre || '';
            document.getElementById('pInfo').value = produto.informacoes || '';
            document.getElementById('pMaxParcelas').value = produto.max_parcelas || 12;
            document.getElementById('pJuros').value = produto.juros_mensal || 0;
            document.getElementById('pInputFoto').value = '';
            document.getElementById('fotosAtuais').innerText = `${fotosExistentes.length} foto(s) atual(is) mantidas.`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function excluirProduto(id) {
            if (!confirm('Excluir este produto da loja?')) return;
            const res = await adminFetch(`/api/produtos/${id}`, { method: 'DELETE' });
            const dados = await res.json();
            if (!dados.sucesso) {
                alert('Nao foi possivel excluir o produto.');
                return;
            }
            carregarProdutos();
        }

        function limparFormulario() {
            document.getElementById('titulo-form').innerText = 'Cadastrar produto';
            document.querySelector('form').reset();
            document.getElementById('produtoId').value = '';
            document.getElementById('pMaxParcelas').value = 12;
            document.getElementById('pJuros').value = '0.00';
            document.getElementById('fotosAtuais').innerText = '';
            fotosExistentes = [];
            listaFotosBase64 = [];
        }

        carregarProdutos();
    </script>
</body>
</html>
