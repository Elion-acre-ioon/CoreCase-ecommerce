<body>

    <header class="header-principal">
        <div class="logo">
            <span class="logo-text-header" onclick="window.location.href='/'">CORE CASE</span>
        </div>
        <nav class="nav-principal">
            <a href="/">Home</a>
            <a href="/loja.html">Loja</a>
            <a href="/cart.html">Carrinho</a>
            <div id="menu-usuario" style="display:inline-block; margin-left:25px;"></div>
        </nav>
    </header>

    <main class="main-container">
        <div class="card-config">
            <h2>Configurações do Perfil</h2>
            <p class="muted">Atualize seus dados cadastrais.</p>

            <form onsubmit="salvarConfiguracoesCliente(event)">
                <div class="avatar-preview-container">
                    <img id="imgPreview" src="https://via.placeholder.com/150?text=Foto" class="avatar-preview" alt="Foto de Perfil">
                    <div>
                        <label style="display:block; margin-bottom:6px; font-weight:600; font-size:14px;">Foto de Perfil</label>
                        <input type="file" id="inputFoto" accept="image/*" onchange="converterFotoBase64(event)">
                    </div>
                </div>
                <div class="form-group">
                    <label for="cfgNome">Nome Completo</label>
                    <input type="text" id="cfgNome" minlength="2" maxlength="120" required>
                </div>

                <div class="linha-dupla" style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
                    <div class="form-group">
                        <label>E-mail</label>
                        <input type="email" id="cfgEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Idade</label>
                        <input type="number" id="cfgIdade" min="1" max="120">
                    </div>
                </div>

                <div class="form-group">
                    <label>CPF (Bloqueado)</label>
                    <input type="text" id="cfgCpf" disabled>
                </div>

                <div class="form-group">
                    <label>Telefone</label>
                    <input type="text" id="cfgTelefone">
                </div>

                <div class="form-group">
                    <label>Endereço de Entrega Padrão</label>
                    <textarea id="cfgEndereco" rows="3"></textarea>
                </div>

                <div class="form-group">
                    <label>CEP</label>
                    <input type="text" id="cfgCep">
                </div>

                <fieldset class="aparencia-config">
                    <legend>Aparência da loja</legend>
                    <p>Escolha como a Core Case aparece quando você estiver conectado.</p>
                    <div class="aparencia-opcoes">
                        <label class="aparencia-opcao">
                            <input type="radio" name="cfgTheme" value="light">
                            <span><strong>Claro</strong><small>Visual original da loja</small></span>
                        </label>
                        <label class="aparencia-opcao">
                            <input type="radio" name="cfgTheme" value="dark">
                            <span><strong>Escuro</strong><small>Menos brilho nas superfícies</small></span>
                        </label>
                    </div>
                </fieldset>

                <button type="submit" class="btn-salvar">Salvar Alterações</button>
            </form>
        </div>
    </main>

    <footer class="footer-loja">
        <p>&copy; 2026 <span>Core Case</span>. Todos os direitos reservados.</p>
    </footer>

    <script src="/header.js"></script>
<script src="/usuario.js"></script>
    <script>
        let fotoBase64Atual = '';
        let usuarioAtual = null;

        async function carregarDadosCliente() {
            usuarioAtual = obterUsuarioLogado();
            if (!usuarioAtual) {
                window.location.href = '/login.html';
                return;
            }

            // Bloquear administradores por esta rota de cliente
            if (Number(usuarioAtual.is_admin) === 1) {
                alert('Área restrita a clientes.');
                window.location.href = '/loja.html';
                return;
            }

            // Preencher campos
            document.getElementById('cfgNome').value = usuarioAtual.nome || '';
            document.getElementById('cfgEmail').value = usuarioAtual.email || '';
            document.getElementById('cfgIdade').value = usuarioAtual.idade || '';
            document.getElementById('cfgCpf').value = usuarioAtual.cpf || '';
            document.getElementById('cfgTelefone').value = usuarioAtual.telefone || '';
            document.getElementById('cfgEndereco').value = usuarioAtual.endereco || '';
            document.getElementById('cfgCep').value = usuarioAtual.cep || '';
            const temaAtual = usuarioAtual.theme === 'dark' ? 'dark' : 'light';
            const opcaoTema = document.querySelector(`input[name="cfgTheme"][value="${temaAtual}"]`);
            if (opcaoTema) opcaoTema.checked = true;
            if (window.CoreCaseTema) window.CoreCaseTema.aplicar(temaAtual);

            if (usuarioAtual.foto) {
                fotoBase64Atual = usuarioAtual.foto;
                document.getElementById('imgPreview').src = fotoBase64Atual;
            }

            // Renderizar menu superior
            if (typeof atualizarMenuUsuario === 'function') {
                atualizarMenuUsuario();
            }
        }

        function converterFotoBase64(event) {
            const arquivo = event.target.files[0];
            if (!arquivo) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                fotoBase64Atual = e.target.result;
                document.getElementById('imgPreview').src = fotoBase64Atual;
            };
            reader.readAsDataURL(arquivo);
        }

        async function salvarConfiguracoesCliente(event) {
            event.preventDefault();

            const dadosAtualizados = {
                ...usuarioAtual,
                nome: document.getElementById('cfgNome').value.replace(/\s+/g, ' ').trim(),
                email: document.getElementById('cfgEmail').value,
                idade: document.getElementById('cfgIdade').value,
                cpf: document.getElementById('cfgCpf').value,
                telefone: document.getElementById('cfgTelefone').value,
                endereco: document.getElementById('cfgEndereco').value,
                cep: document.getElementById('cfgCep').value,
                foto: fotoBase64Atual,
                theme: document.querySelector('input[name="cfgTheme"]:checked')?.value || 'light'
            };

            try {
                const res = await fetch(`/api/usuarios/${usuarioAtual.id}/perfil`, {
                    method: 'PUT',
                    credentials: 'include',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-User-Token': localStorage.getItem('userToken') || ''
                    },
                    body: JSON.stringify(dadosAtualizados)
                });

                const respostaJson = await res.json();
                if (res.ok) {
                    dadosAtualizados.nome = respostaJson.nome || dadosAtualizados.nome;
                    dadosAtualizados.theme = respostaJson.theme || dadosAtualizados.theme;
                    usuarioAtual = dadosAtualizados;
                    salvarUsuarioLogado(dadosAtualizados);
                    alert('Configurações salvas com sucesso! Elas já são seu padrão.');
                } else {
                    if (window.CoreCaseTema) window.CoreCaseTema.aplicar(usuarioAtual.theme || 'light', true);
                    alert(respostaJson.erro || 'Erro ao salvar configurações.');
                }
            } catch (e) {
                if (window.CoreCaseTema) window.CoreCaseTema.aplicar(usuarioAtual.theme || 'light', true);
                alert('Não foi possível salvar as configurações. Tente novamente.');
            }
        }

        document.querySelectorAll('input[name="cfgTheme"]').forEach(opcao => {
            opcao.addEventListener('change', () => {
                if (opcao.checked && window.CoreCaseTema) window.CoreCaseTema.aplicar(opcao.value, true);
            });
        });

        carregarDadosCliente();
    </script>
</body>
</html>
