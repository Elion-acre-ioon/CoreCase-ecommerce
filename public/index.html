<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Core Case - Vitrine</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <header>
        <span style="font-weight: 900; font-size: 24px; letter-spacing: 1px;">CORE CASE</span>
        <div style="display: flex; gap: 15px; align-items: center;">
            <button onclick="window.location.href='/checkout.html'" style="background-color: #1e293b; border: 1px solid #334155; width: auto;">🛒 Ver Meu Carrinho</button>
            <div id="painelUsuario"></div>
        </div>
    </header>

    <main style="padding: 20px;">
        <div style="max-width: 1200px; margin: 20px auto;">
            <input type="text" id="busca" placeholder="Pesquisar capas e acessórios..." oninput="carregarProdutos()" style="width:100%; padding:14px; border-radius:8px; border: 1px solid #cbd5e1; font-size: 16px;">
        </div>
        <div id="lista-produtos" class="grid"></div>
    </main>

    <script>
        const usuarioLogado = JSON.parse(localStorage.getItem('usuario'));
        const painel = document.getElementById('painelUsuario');
        
        if(usuarioLogado) {
            const linkAdmin = Number(usuarioLogado.is_admin) === 1
                ? `<button onclick="window.location.href='/admin-loja.html'" style='width:auto; padding:5px 10px; font-size:12px; background:#334155;'>Painel Admin</button>`
                : '';
            painel.innerHTML = `Olá, ${usuarioLogado.nome} ${linkAdmin} <button onclick="logout()" style='width:auto; padding:5px 10px; font-size:12px;'>Sair</button>`;
        } else {
            painel.innerHTML = `<button onclick="window.location.href='/login.html'" style='width:auto;'>Minha Conta</button>`;
        }

       async function carregarProdutos() {
    const busca = document.getElementById('busca').value.toLowerCase();
    const res = await fetch('/api/produtos');
    const produtos = await res.json();
    const container = document.getElementById('lista-produtos');
    
    container.innerHTML = '';
    produtos.filter(p => p.nome.toLowerCase().includes(busca)).forEach(p => {
        // Extrai a primeira foto da lista JSON se houver múltiplas cadastradas
        let fotoExibição = '';
        try {
            let fArr = JSON.parse(p.foto);
            fotoExibição = Array.isArray(fArr) ? fArr[0] : p.foto;
        } catch(e) {
            fotoExibição = p.foto;
        }

        container.innerHTML += `
            <div class="card">
                <img src="${fotoExibição}" alt="${p.nome}" onerror="this.src='https://via.placeholder.com/300?text=Core+Case'">
                <h3>${p.nome}</h3>
                <p class="preco">R$ ${Number(p.preco || 0).toFixed(2)}</p>
                <div>
                    <button onclick=\"verProduto(${p.id})\" style="margin-bottom:8px;">Visualizar Detalhes</button>
                    <button onclick=\"adicionarAoCarrinhoReal(${p.id}, '${p.nome}', ${Number(p.preco || 0)}, '${fotoExibição}')\" style="background:#e2e8f0; color:#1e293b;">Adicionar ao Carrinho</button>
                </div>
            </div>
        `;
    });
}

        function adicionarAoCarrinhoReal(id, nome, preco, foto) {
            let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
            const itemExistente = carrinho.find(item => item.id === id);
            
            if (itemExistente) {
                itemExistente.qtd += 1;
            } else {
                carrinho.push({ id, nome, preco, foto, qtd: 1 });
            }
            
            localStorage.setItem('carrinho', JSON.stringify(carrinho));
            alert("Produto guardado no carrinho!");
        }

        function verProduto(id) { window.location.href = `/produto.html?id=${id}`; }
        function logout() { localStorage.clear(); window.location.reload(); }
        carregarProdutos();
    </script>
</body>
</html>
