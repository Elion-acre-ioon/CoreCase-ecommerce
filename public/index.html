<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <script src="/analytics.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Core Case - Nova experiencia em preparo</title>
    <link rel="stylesheet" href="/style.css?v=corecase-20260807b">
    <style>
        .manutencao-home {
            min-height: calc(100vh - 168px);
            display: grid;
            place-items: center;
            padding: 44px 20px;
            background:
                linear-gradient(135deg, rgba(17,17,17,0.94), rgba(52,6,6,0.9)),
                url('/img/painel1.png') center/cover no-repeat;
            color: #fff;
            text-align: center;
        }
        .manutencao-conteudo {
            width: min(680px, 100%);
        }
        .manutencao-conteudo h1 {
            margin: 0 0 20px;
            font-size: clamp(2.6rem, 8vw, 5rem);
            letter-spacing: 2px;
            color: #fff;
        }
        .manutencao-conteudo h2 {
            margin: 0 0 16px;
            font-size: clamp(1.5rem, 4vw, 2.5rem);
            color: #fff;
        }
        .manutencao-conteudo p {
            margin: 0 auto 14px;
            max-width: 540px;
            color: rgba(255,255,255,0.86);
            font-size: 1.05rem;
            line-height: 1.65;
        }
        .btn-loja-home {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 48px;
            margin: 20px 0 14px;
            padding: 0 28px;
            border-radius: 4px;
            background: var(--vermelho-core);
            color: #fff;
            text-decoration: none;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: .4px;
        }
        .btn-loja-home:hover { background: #7a0000; }
        .novidades-home {
            display: block;
            margin-top: 8px;
            color: rgba(255,255,255,0.72);
            font-weight: 700;
        }
    </style>
</head>
<body>
    <main class="manutencao-home">
        <section class="manutencao-conteudo" aria-labelledby="titulo-home">
            <h1 id="titulo-home">CORE CASE</h1>
            <h2>Estamos preparando uma nova experiencia.</h2>
            <p>Nossa vitrine esta sendo reformulada, mas nossa loja continua funcionando normalmente.</p>
            <a class="btn-loja-home" href="/loja.html">Acessar a loja</a>
            <span class="novidades-home">Novidades em breve.</span>
        </section>
    </main>
    <script src="/header.js"></script>
    <script src="/usuario.js"></script>
</body>
</html>
