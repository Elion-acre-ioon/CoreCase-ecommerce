<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login ou Cadastro</title>
    <!-- Link para o novo CSS com efeito Glassmorphism -->
    <link rel="stylesheet" href="/login.css">
    <script src="/usuario.js"></script>
</head>
<body>

    <div class="login-wrapper">
        
        <!-- CARD DE LOGIN -->
        <div class="glass-card">
            <div>
                <h2>LOGIN</h2>
                
                <div class="input-group">
                    <input type="text" id="loginEmail" placeholder="E-mail ou login">
                </div>
                
                <div class="input-group">
                    <input type="password" id="loginSenha" placeholder="Senha">
                </div>

                <a href="#" class="forgot-password">Esqueceu a senha?</a>

                <button class="btn-glass" onclick="efetuarLogin()">Entrar</button>

                <div class="divider">
                    <span>OU</span>
                </div>

                <!-- Botões de Login Social (Google e Facebook) -->
                <div class="social-login">
                    <a href="#" class="social-btn" title="Entrar com Google">
                        <svg viewBox="0 0 24 24">
                            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.3 8.9 5 12 5z"/>
                            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                            <path fill="#FBBC05" d="M5.3 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.6 7.4C.6 9.4 0 11.6 0 12s.6 2.6 1.6 4.6l3.7-2.8z"/>
                            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.3-6.7-5.3L1.6 15.8C3.5 19.6 7.4 23 12 23z"/>
                        </svg>
                    </a>
                    <a href="#" class="social-btn" title="Entrar com Facebook">
                        <svg viewBox="0 0 24 24">
                            <path fill="#1877F2" d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
                        </svg>
                    </a>
                </div>
            </div>
        </div>

        <!-- CARD DE CADASTRO -->
        <div class="glass-card">
            <div>
                <h2>CRIAR CONTA</h2>
                
                <div class="input-group">
                    <input type="text" id="cadNome" placeholder="Nome Completo">
                </div>

                <div class="input-group">
                    <input type="text" id="cadCpf" placeholder="CPF">
                </div>

                <div class="input-group">
                    <input type="text" id="cadCep" placeholder="CEP">
                </div>

                <div class="input-group">
                    <input type="text" id="cadEndereco" placeholder="Endereço">
                </div>

                <div class="input-group">
                    <input type="text" id="cadTelefone" placeholder="Telefone">
                </div>

                <div class="input-group">
                    <input type="email" id="cadEmail" placeholder="E-mail">
                </div>

                <div class="input-group">
                    <input type="password" id="cadSenha" placeholder="Senha">
                </div>

                <div class="input-group">
                    <label>Foto de Perfil:</label>
                    <input type="file" id="cadFoto" accept="image/*">
                </div>

                <button class="btn-glass" onclick="efetuarCadastro()">Cadastrar Conta</button>
            </div>
        </div>

    </div>

    <script>
        let fotoBase64 = "";

        // Exibe a notificação de cadastro concluído após o reload da página
        window.addEventListener('DOMContentLoaded', () => {
            const msg = sessionStorage.getItem('msg_pos_cadastro');
            if (msg) {
                sessionStorage.removeItem('msg_pos_cadastro');
                alert(msg);
            }
        });
        
        document.getElementById('cadFoto').addEventListener('change', function(e) {
            const reader = new FileReader();
            reader.onload = function() { fotoBase64 = reader.result; };
            if (e.target.files[0]) {
                reader.readAsDataURL(e.target.files[0]);
            }
        });

        async function efetuarLogin() {
            const email = document.getElementById('loginEmail').value.trim();
            const senha = document.getElementById('loginSenha').value;

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });
                const dados = await res.json();

                if (dados.sucesso) {
                    salvarUsuarioLogado(dados.usuario);
                    if (dados.userToken) {
                        localStorage.setItem('userToken', dados.userToken);
                    }
                    if (dados.adminToken && Number(dados.usuario.is_admin) === 1) {
                        localStorage.setItem('adminToken', dados.adminToken);
                        window.location.href = '/admin-loja.html';
                        return;
                    } else {
                        localStorage.removeItem('adminToken');
                    }
                    retornarOrigem();
                } else {
                    alert(dados.erro || 'Não foi possível fazer login.');
                }
            } catch (e) {
                console.error('[login] erro de rede/servidor:', e);
                alert('Erro de conexão com o servidor.');
            }
        }

        async function efetuarCadastro() {
            const dados = {
                nome: document.getElementById('cadNome').value,
                cpf: document.getElementById('cadCpf').value,
                cep: document.getElementById('cadCep').value,
                endereco: document.getElementById('cadEndereco').value,
                telefone: document.getElementById('cadTelefone').value,
                email: document.getElementById('cadEmail').value.trim(),
                senha: document.getElementById('cadSenha').value,
                fotoBase64
            }; 

            try {
                const res = await fetch('/api/cadastro', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });
                const respData = await res.json();
                if(respData.sucesso) {
                    sessionStorage.setItem('msg_pos_cadastro', 'Cadastro realizado, faça login.');
                    window.location.reload();
                } else { 
                    alert(respData.erro || "Erro ao cadastrar."); 
                }
            } catch (e) {
                console.error('[cadastro] erro:', e);
                alert('Erro de conexão ao cadastrar.');
            }
        }

        function retornarOrigem() {
            let destino = localStorage.getItem('redirecionar_depois') || '/loja.html';
            localStorage.removeItem('redirecionar_depois');

            const usuario = obterUsuarioLogado();
            if (!usuario || Number(usuario.is_admin) !== 1) {
                if (destino.startsWith('/admin')) {
                    destino = '/loja.html';
                }
            }
            window.location.href = destino;
        }
    </script>
</body>
</html>
